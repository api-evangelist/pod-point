actions:
  apisYmlUpdated: true
  apisListed: 1
  developerPortal: ''
  portalConfirmed: false
  reason: |
    One API is listed and exactly one: the OCPI 2.2.1 CPO service, because it is
    Pod's own host, it is live, it conforms to a public standard, and its version and
    version-detail responses were retrieved anonymously and are quoted verbatim in
    this file. developerPortal is empty and portalConfirmed is false because no
    developer portal exists on any Pod domain — the subdomains do not resolve and the
    paths 404. The undocumented mobile backend and the dead legacy consumer API are
    recorded as observations in this review and appear nowhere in apis.yml.
