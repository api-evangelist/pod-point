artifacts:
  openapiHarvested: false
  specsCount: 0
  reason: |
    Nothing to harvest. Pod publishes no OpenAPI, Swagger, AsyncAPI, GraphQL schema,
    JSON Schema, Postman collection or SDK. /openapi.json, /swagger.json, /api-docs
    and /docs return 404 on every Pod host probed. No openapi/ directory was created
    because creating one would have meant generating a spec from the OCPI standard
    and attributing it to Pod, which would be fabrication. The OCPI version and
    version-detail payloads Pod actually serves are recorded verbatim in the
    mandate.howVerified block above; they are a module directory, not a contract, and
    they are not stored as a spec.

