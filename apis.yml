apis:
- aid: pod-point:pod-point-ocpi-cpo-api
  name: Pod OCPI 2.2.1 CPO API
  description: >-
    Pod's Open Charge Point Interface (OCPI) 2.2.1 service in the Charge Point Operator
    role, used for e-mobility roaming and as the technical vehicle named by the UK
    Public Charge Point Regulations 2023 for charge point reference and availability
    data. Version discovery is anonymous: GET /ocpi/cpo/versions returned HTTP 200 on
    2026-07-27 advertising version 2.2.1, and GET /ocpi/cpo/2.2.1 returned HTTP 200
    enumerating cdrs, credentials, locations, sessions and tariffs in the SENDER role
    plus commands, credentials and tokens in the RECEIVER role. Every one of those data
    modules returns HTTP 401 with OCPI status_code 2000 Unauthorized to an anonymous
    caller; access requires an OCPI credentials token exchanged bilaterally with Pod.
    Pod publishes no human documentation, no OpenAPI and no onboarding path for this
    API — the module list the service returns about itself is the only contract.
  humanURL: https://ocpi.podenergy.com/ocpi/cpo/versions
  baseURL: https://ocpi.podenergy.com/ocpi/cpo/2.2.1
