name: Pod Point
kind: company
description: >-
  Pod Point — trading as Pod since its February 2026 rebrand, with pod-point.com now
  301-redirecting to podenergy.com — is a British electric vehicle charging company
  founded in London in 2009 and wholly owned by EDF since its delisting from the London
  Stock Exchange in August 2025. It sells and installs home, workplace and fleet
  chargers, operates the third-largest public charging network in the United Kingdom
  across Tesco and Lidl car parks, and acquired depot-charging specialist EO Charging in
  May 2026. It sits on the demand side of the UK electricity value chain, between the
  driver and the electricity supplier, as a Charge Point Operator rather than a
  metering, network or settlement body. Its API posture is narrow but real and honestly
  split: there is no developer portal, no OpenAPI, no Swagger and no consumer data API,
  yet a live OCPI 2.2.1 Charge Point Operator service runs at ocpi.podenergy.com whose
  version negotiation answers anonymously and enumerates a full module set, while every
  data module — locations, tariffs, sessions, CDRs — returns 401 Unauthorized without a
  bilaterally exchanged OCPI credentials token. Britain's Public Charge Point
  Regulations 2023 name OCPI 2.2.1 as the vehicle for open charge point data; the
  plumbing that regulation names is verifiably in place at Pod, but the open part of it
  is not obtainable anonymously from outside, and the company publishes no open data
  page, no OCPI token policy and no developer onboarding of any kind.
