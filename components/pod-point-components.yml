note: >-
  Pod publishes a real family of first-party, client-side UI component libraries on
  npm. They are front-end building blocks for Pod's own web properties rather than
  embeddable widgets offered to third-party developers — there is no documented
  embed/integration story, no hosted loader script and no developer portal describing
  them. Catalogued because they are genuinely published, first-party and installable;
  characterised honestly as internal-facing.
