note: >-
  Pod Point publishes real, first-party client libraries under the @pod-point npm
  scope and the pod-point Packagist vendor. THREE of them are genuine API client
  wrappers for Pod Point's own APIs — api3-js, api5-js and rfid-api-js — which the
  2026-07-27 review did not surface because it only probed web hosts, not registries.
  IMPORTANT CAVEAT, recorded honestly: the hosts these SDKs target are decommissioned.
  api.pod-point.com (the base URL hard-coded in both api3-js and api5-js) returns
  HTTP 403 S3 AccessDenied on every path, and rfid-api.pod-point.com no longer
  resolves in DNS. These are published, official, and no longer functional against a
  live backend. They are catalogued as `status: legacy`. None of them targets the one
  live API (the OCPI 2.2.1 CPO service), for which Pod ships no client library.
