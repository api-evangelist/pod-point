    EV guides, not API documentation.
  captured: llms/pod-point-llms.txt
- id: openapi
  conforms: false
  evidence: >-
    /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /docs and /redoc all
    return 404 on ocpi.podenergy.com and mobile-api.pod-point.com, and 403 on
    api.pod-point.com. No OpenAPI or Swagger is published anywhere.
- id: asyncapi
  conforms: false
  evidence: No AsyncAPI document and no published event or webhook surface.
- id: graphql
