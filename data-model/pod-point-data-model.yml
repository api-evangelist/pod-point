note: >-
  Two distinct, non-overlapping data models, from two different eras of Pod's API
  estate. The OCPI model is the LIVE one and its module list is what Pod's own service
  reports about itself. The Network API model is read directly out of Pod's published
  SDK type definitions — real first-party declarations, not inference — but its backing
  host is decommissioned. Neither model is fabricated; entity fields below appear
  verbatim in one of those two sources.
models:
- id: ocpi-cpo
  name: OCPI 2.2.1 CPO model
  status: live
  api: pod-point:pod-point-ocpi-cpo-api
  source: https://ocpi.podenergy.com/ocpi/cpo/2.2.1
  source_kind: live-module-directory
  note: >-
    Pod enumerates the modules; the object shapes inside them are defined by OCPI
    2.2.1, not by Pod. Field-level detail is not asserted here because every data
    module returns 401 anonymously, so no Pod object was ever observed.
  entities:
  - name: Location
    module: locations
    role: SENDER
    description: A charging site. Contains EVSEs, which contain Connectors.
    endpoint: https://ocpi.podenergy.com/ocpi/cpo/2.2.1/locations
    access: 401
  - name: EVSE
    module: locations
    role: SENDER
    description: An individually addressable charging point within a Location.
  - name: Connector
    module: locations
    role: SENDER
    description: A physical socket or attached cable on an EVSE.
  - name: Tariff
    module: tariffs
    role: SENDER
    endpoint: https://ocpi.podenergy.com/ocpi/cpo/2.2.1/tariffs
    access: 401
  - name: Session
    module: sessions
    role: SENDER
    description: An in-progress or completed charging session.
    endpoint: https://ocpi.podenergy.com/ocpi/cpo/2.2.1/sessions
    access: 401
  - name: CDR
    module: cdrs
    role: SENDER
    description: Charge Detail Record — the billable record of a completed session.
    endpoint: https://ocpi.podenergy.com/ocpi/cpo/2.2.1/cdrs
    access: 401
  - name: Credentials
    module: credentials
    role: SENDER, RECEIVER
    description: The bilateral token-exchange handshake object.
    access: 401
  - name: Token
    module: tokens
    role: RECEIVER
    description: An eMSP-issued authorisation token the CPO accepts at the charge point.
  - name: Command
    module: commands
    role: RECEIVER
    description: Remote commands — start/stop session, reserve, unlock connector.
