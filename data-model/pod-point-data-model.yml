summary:
  models: 2
  live_models: 1
  ocpi_entities: 9
  legacy_entities: 32
  overlap: >-
    The two models describe the same physical world from opposite ends. OCPI exposes
    the roaming/network view (Location, EVSE, Connector, Session, CDR, Tariff) to other
    e-mobility operators. The Network API exposed the consumer/owner view (User,
    Account, PodLocation, PodUnit, Charge, Tariff, Card) to Pod's own apps. Only Tariff
    and Session appear in both, and they are not the same object.
